# Vérification et évaluation de tous les programmes sous toutes les hypothèses.
#
# Tourne sur chaque PR, y compris depuis un fork : le jeton est en lecture
# seule et aucun secret n'est exposé. Le commentaire de PR est publié par un
# workflow séparé et privilégié (commentaire-pr.yml) qui n'exécute jamais le
# code de la PR.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Vérifier et évaluer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Installer elan (gestionnaire de versions Lean)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache de la chaîne Lean
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Registre des programmes
        id: registre
        continue-on-error: true
        run: python3 scripts/verifier_registre.py

      - name: Compiler le modèle, les hypothèses, les propriétés et les programmes
        id: compilation
        run: lake build rapport

      - name: Calculer la matrice d'évaluation
        id: rapport
        continue-on-error: true
        run: |
          mkdir -p out
          lake exe rapport --json out/rapport.json --md out/rapport.md

      - name: Calculer la matrice sur la branche de base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p out
          git diff --name-only "$BASE_SHA" "$GITHUB_SHA" > out/fichiers.txt
          git worktree add -q ../base "$BASE_SHA"
          # La base peut ne pas compiler (premier commit, toolchain cassée…) :
          # dans ce cas le diff présente tout comme nouveau.
          ( cd ../base && lake build rapport && lake exe rapport --json "$GITHUB_WORKSPACE/out/base.json" --md /dev/null ) \
            || echo "::warning::La base ne produit pas de rapport ; diff calculé contre un rapport vide."

      - name: Comparer base et PR
        if: github.event_name == 'pull_request' && !cancelled()
        run: |
          mkdir -p out
          python3 scripts/diff_rapport.py out/base.json out/rapport.json \
            --fichiers out/fichiers.txt --out out/diff.md

      - name: Vérifier les engagements (preuves Lean)
        id: engagements
        continue-on-error: true
        run: lake build Engagements

      - name: Auditer les axiomes (pas de sorry, native_decide ni axiom)
        id: audit
        continue-on-error: true
        run: lake env lean Audit.lean

      - name: Rédiger le résumé
        if: ${{ !cancelled() }}
        env:
          REGISTRE: ${{ steps.registre.outcome }}
          COMPILATION: ${{ steps.compilation.outcome }}
          RAPPORT: ${{ steps.rapport.outcome }}
          ENGAGEMENTS: ${{ steps.engagements.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p out
          statut() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }
          {
            echo "### Vérifications"
            echo ""
            echo "| Vérification | Statut |"
            echo "| --- | --- |"
            echo "| Registre des programmes | $(statut "$REGISTRE") |"
            echo "| Compilation (modèle, hypothèses, propriétés, programmes) | $(statut "$COMPILATION") |"
            echo "| Matrice d'évaluation | $(statut "$RAPPORT") |"
            echo "| Engagements prouvés par le noyau Lean | $(statut "$ENGAGEMENTS") |"
            echo "| Audit des axiomes | $(statut "$AUDIT") |"
            echo ""
            [ -f out/diff.md ] && cat out/diff.md && echo ""
            if [ -f out/rapport.md ]; then
              echo "<details><summary>Rapport complet</summary>"
              echo ""
              sed 's/^# /#### /; s/^## /#### /' out/rapport.md
              echo ""
              echo "</details>"
            fi
          } > out/commentaire.md
          cat out/commentaire.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$PR_NUMBER" ]; then
            echo "$PR_NUMBER" > out/pr_number
            echo "$HEAD_SHA" > out/head_sha
          fi

      - name: Publier le rapport (artefact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'rapport-pr' || 'rapport' }}
          path: out/
          retention-days: ${{ github.event_name == 'pull_request' && 7 || 90 }}

      - name: Statut final
        if: ${{ !cancelled() }}
        env:
          REGISTRE: ${{ steps.registre.outcome }}
          RAPPORT: ${{ steps.rapport.outcome }}
          ENGAGEMENTS: ${{ steps.engagements.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
        run: |
          echo "registre=$REGISTRE rapport=$RAPPORT engagements=$ENGAGEMENTS audit=$AUDIT"
          for s in "$REGISTRE" "$RAPPORT" "$ENGAGEMENTS" "$AUDIT"; do
            [ "$s" = "success" ] || exit 1
          done
