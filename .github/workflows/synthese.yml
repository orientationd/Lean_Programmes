# Synthèse PDF des programmes : tableaux et courbes sur dix ans (PIB, déficit
# et dette publics, chômage, actifs, emploi par secteur, impôts et taxes,
# sensibilité au prix du pétrole et à la natalité) ; programme complet de
# chaque programme (scripts/programme_pdf.py).
#
# Tourne sur main (code déjà relu), à la demande (paramètres `moteur` et
# `programmes` pour une synthèse personnalisée) et sur les PR qui touchent
# un moteur contribué (son auteur obtient sa synthèse en artefact). Jamais
# de secret ni d'écriture : le code de la PR ne peut rien falsifier d'autre
# que son propre PDF. Artefact « synthese ».

name: Synthèse PDF

on:
  push:
    branches: [main]
  pull_request:
    paths: ["Moteurs/**", "Moteurs.lean"]
  workflow_dispatch:
    inputs:
      moteur:
        description: "Identifiant du moteur au centre de la synthèse (vide : moteur standard)"
        required: false
        default: ""
      programmes:
        description: "Identifiants de programmes à inclure, séparés par des virgules (vide : tous)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: synthese-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthese:
    name: Générer la synthèse PDF
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELAN_NO_OVERRIDE_NOTICE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer elan (gestionnaire de versions Lean)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache de la chaîne Lean
        uses: actions/cache@v4
        with:
          path: ~/.elan/toolchains
          key: elan-${{ runner.os }}-${{ hashFiles('lean-toolchain') }}

      - name: Compiler et exporter les trajectoires
        run: |
          mkdir -p out
          lake build Programmes Moteurs
          lake env lean --run Rapport.lean --json out/rapport.json --md out/rapport.md \
            --synthese out/synthese.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mettre en page le PDF
        env:
          MOTEUR: ${{ github.event.inputs.moteur }}
          PROGRAMMES: ${{ github.event.inputs.programmes }}
        run: |
          python -m pip install --quiet matplotlib==3.11.2 reportlab==5.0.1
          python scripts/synthese_pdf.py out/synthese.json out/synthese.pdf --commit "$GITHUB_SHA"
          # Synthèse personnalisée : moteur et programmes choisis au lancement…
          if [ -n "$MOTEUR" ] || [ -n "$PROGRAMMES" ]; then
            python scripts/synthese_pdf.py out/synthese.json "out/synthese-personnalisee.pdf" \
              --commit "$GITHUB_SHA" ${MOTEUR:+--moteur "$MOTEUR"} ${PROGRAMMES:+--programmes "$PROGRAMMES"}
          fi
          # …et une synthèse centrée sur chaque moteur contribué.
          for d in Moteurs/*/; do
            m=$(basename "$d")
            python scripts/synthese_pdf.py out/synthese.json "out/synthese-$m.pdf" --commit "$GITHUB_SHA" --moteur "$m"
          done
          # Programme complet de chaque programme (mesures, sources, effets).
          for d in Programmes/*/; do
            p=$(basename "$d")
            python scripts/programme_pdf.py out/synthese.json "$p" "out/programme-$p.pdf" --commit "$GITHUB_SHA"
          done

      - name: Publier la synthèse (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: synthese
          path: |
            out/synthese*.pdf
            out/programme-*.pdf
            out/synthese.json
          retention-days: 90
